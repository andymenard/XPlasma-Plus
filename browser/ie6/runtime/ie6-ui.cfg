// IE6 toolbar controls for this dedicated ESR installation.
(() => {
 // XPlasma's small appearance file changes only IE6 chrome, never websites.
 function readAppearance() {
  try {
   const file=Services.dirsvc.get('Home',Components.interfaces.nsIFile);
   for(const name of ['.local','share','xplasma','appearance.json'])file.append(name);
   if(!file.exists())return {};
   const input=Components.classes['@mozilla.org/network/file-input-stream;1'].createInstance(Components.interfaces.nsIFileInputStream);
   input.init(file,1,0,0);
   const stream=Components.classes['@mozilla.org/scriptableinputstream;1'].createInstance(Components.interfaces.nsIScriptableInputStream);
   stream.init(input);let text;
   try {text=stream.read(Math.min(stream.available(),4096));} finally {stream.close();}
   return JSON.parse(text);
  } catch(error) {return {};}
 }
 function setDarkMode(win) {
  const appearance=readAppearance(),value=String(appearance.darkMode===true),d=win.document;
  d.documentElement.setAttribute('xplasma-crisp',String(appearance.crispText===true));
  const dpr=win.devicePixelRatio||1;
  // Gecko quantizes CSS pixels to integer app units (e.g. 275% reports
  // 60/22 = 2.72727). Select by the unrounded display scale when available,
  // then size the face against the actual CSS-to-device ratio.
  let displayScale=dpr;
  try {
   const override=Number(Services.prefs.getCharPref('layout.css.devPixelsPerPx','-1'));
   if(override>0)displayScale=override;
   else {
    const native=win.docShell.treeOwner.QueryInterface(Components.interfaces.nsIBaseWindow).devicePixelsPerDesktopPixel;
    if(native>0&&Math.abs(native-dpr)<0.1)displayScale=native;
    else {
     for(let step=4;step<=12;step++) {
      const target=step/4;
      if(Math.abs(dpr-60/Math.round(60/target))<0.00001) {displayScale=target;break;}
     }
    }
   }
  } catch(error) { /* A non-browser window may not expose its native widget. */ }
  const pixelScale=Number.isFinite(displayScale)&&displayScale>=1&&displayScale<=3&&Math.abs(displayScale*4-Math.round(displayScale*4))<0.0001;
  const physicalSize=Math.round(11*displayScale);
  const family=physicalSize===11?'XPlasma Tahoma Pixel':`XPlasma Tahoma Pixel ${physicalSize}`;
  d.documentElement.setAttribute('xplasma-crisp-pixels',String(appearance.crispText===true&&pixelScale));
  d.documentElement.style.setProperty('--xplasma-crisp-size',pixelScale?`${physicalSize/dpr}px`:'11px');
  d.documentElement.style.setProperty('--xplasma-crisp-family',pixelScale?`"${family}",Tahoma,sans-serif`:'Tahoma,sans-serif');
  d.documentElement.setAttribute('xplasma-dark',value);
  // The native search selector has an independent shadow-tree stylesheet.
  d.querySelector('#urlbar .searchmode-switcher')?.setAttribute('xplasma-dark',value);
 }
 function initializeMenuBar(win) {
  const d=win.document,bar=d.getElementById('toolbar-menubar');
  if(!bar||Services.prefs.getIntPref('xplasma.ie6.menuBarDefaultsVersion',0)>=2)return;
  const initialized=Services.prefs.getBoolPref('xplasma.ie6.menuBarInitialized',false);
  const saved=Services.xulStore.getValue(d.documentURI,bar.id,'autohide');
  const hasSaved=Services.xulStore.hasValue(d.documentURI,bar.id,'autohide');
  // Use Firefox's own toggle so its checkbox and persistence stay in sync.
  // Repair old initialized profiles with no saved choice; retain explicit choices.
  if(!initialized||!hasSaved||saved==='false') {
   win.setToolbarVisibility(bar,true);
   Services.xulStore.persist(bar,'autohide');
  }
  Services.prefs.setBoolPref('xplasma.ie6.menuBarInitialized',true);
  Services.prefs.setIntPref('xplasma.ie6.menuBarDefaultsVersion',2);
 }
 const observers=Components.classes['@mozilla.org/observer-service;1'].getService(Components.interfaces.nsIObserverService);
 function apply(win) {
  const d=win.document;
  setDarkMode(win);
  if(d.documentElement.getAttribute('windowtype')!=='navigator:browser'||d.getElementById('ie6-search-button'))return;
  const darkTimer=win.setInterval(()=>setDarkMode(win),1500);
  win.addEventListener('unload',()=>win.clearInterval(darkTimer),{once:true});
  initializeMenuBar(win);
  // Internal Firefox pages use shadow components whose icons do not inherit
  // userChrome selectors. Remap only built-in icon attributes on these pages;
  // website documents and real site/extension logos are not inspected.
  if(win.messageManager) {
   const files={
    'category-general.svg':'sized/settings.svg','category-home.svg':'sized/home.svg',
    'category-search.svg':'sized/search.svg','category-privacy.svg':'sized/privacy.svg',
    'category-sync.svg':'sized/refresh.svg','category-experimental.svg':'sized/addon.svg',
    'settings.svg':'sized/settings.svg','help.svg':'sized/help.svg','info.svg':'sized/info.svg',
    'info-filled.svg':'sized/info.svg','warning.svg':'sized/security-warning.svg',
    'error.svg':'sized/security-error.svg','security-warning.svg':'sized/security-warning.svg',
    'security-broken.svg':'sized/security-error.svg','folder.svg':'sized/bookmark-folder.svg',
    'close.svg':'close.svg','close-12.svg':'close.svg','extension.svg':'sized/addon.svg',
    'login.svg':'sized/password.svg','search-glass.svg':'sized/search.svg'
   };
   const images={};
   for(const [name,asset] of Object.entries(files)) {
    const file=Services.dirsvc.get('ProfD',Components.interfaces.nsIFile);
    file.append('chrome');file.append('ie6-icons');
    for(const part of asset.split('/'))file.append(part);
    if(!file.exists())continue;
    const input=Components.classes['@mozilla.org/network/file-input-stream;1'].createInstance(Components.interfaces.nsIFileInputStream);
    input.init(file,1,0,0);
    const stream=Components.classes['@mozilla.org/binaryinputstream;1'].createInstance(Components.interfaces.nsIBinaryInputStream);
    stream.setInputStream(input);
    images[name]='data:image/'+(asset.endsWith('.svg')?'svg+xml':'png')+';base64,'+win.btoa(stream.readBytes(stream.available()));
    stream.close();
   }
   const script=`(() => {
    const images=${JSON.stringify(images)};
    const allowed=new Set(['about:preferences','about:addons','about:downloads','about:logins','about:protections']);
    const watched=new WeakSet();
    function scan(root) {
     if(!root||watched.has(root))return;
     watched.add(root);
     function update() {
      for(const node of root.querySelectorAll('*')) {
       for(const attribute of ['iconsrc','src']) {
        const value=node.getAttribute(attribute)||'';
        if(!value.startsWith('chrome://')&&!value.startsWith('resource://'))continue;
        const image=images[value.split('/').pop()];
        if(image)node.setAttribute(attribute,image);
       }
       if(node.shadowRoot)scan(node.shadowRoot);
      }
     }
     update();
     new content.MutationObserver(update).observe(root,{childList:true,subtree:true,attributes:true,attributeFilter:['src','iconsrc']});
    }
    function apply(doc) { if(allowed.has((doc.documentURI||'').split(/[?#]/)[0]))scan(doc); }
    addEventListener('DOMContentLoaded',event=>{if(event.target.nodeType===9)apply(event.target);},true);
    if(content.document)apply(content.document);
   })();`;
   win.messageManager.loadFrameScript('data:application/javascript;charset=utf-8,'+encodeURIComponent(script),true);
  }
  const search=d.createXULElement('toolbarbutton');
  search.id='ie6-search-button';search.className='toolbarbutton-1';
  search.setAttribute('label','Search');search.setAttribute('tooltiptext','Search the web');
  search.addEventListener('command',()=>{win.gURLBar.search("? ");});
  const old=d.getElementById('search-container');
  const searchAnchor=old||d.getElementById('bookmarks-menu-button')||d.getElementById('urlbar-container');
  if(searchAnchor)searchAnchor.before(search);else d.getElementById('nav-bar-customization-target').appendChild(search);
  const switcher=d.querySelector('#urlbar .searchmode-switcher');
  if(switcher) {
   switcher.setAttribute('xplasma-dark',d.documentElement.getAttribute('xplasma-dark'));
   const file=Components.classes['@mozilla.org/file/directory_service;1'].getService(Components.interfaces.nsIProperties).get('ProfD',Components.interfaces.nsIFile);
   file.append('chrome');file.append('ie6-icons');file.append('sized');file.append('search.svg');
   const uri=Components.classes['@mozilla.org/network/io-service;1'].getService(Components.interfaces.nsIIOService).newFileURI(file).spec;
   const update=()=>{if(switcher.getAttribute('iconsrc')!==uri)switcher.setAttribute('iconsrc',uri);};
   update();
   win.setTimeout(()=>{
    if(switcher.shadowRoot && !switcher.shadowRoot.getElementById('ie6-search-art')){
     const style=d.createElementNS('http://www.w3.org/1999/xhtml','style');style.id='ie6-search-art';
     style.textContent='.button-background { background:transparent !important; border-radius:0 !important; box-shadow:none !important; padding:0 !important; min-width:0 !important; min-height:0 !important; gap:0 !important; } #main-button { border-radius:0 !important; background:linear-gradient(#fffef9,#e3e9f3) !important; border:1px solid #7f9db9 !important; box-shadow:inset 1px 1px white,inset -1px -1px #c5cee0 !important; padding:0 !important; min-width:17px !important; min-height:19px !important; height:19px !important; } #main-button:hover { background:linear-gradient(#fffdf0,#f6e7c2) !important; } #main-button:active { box-shadow:inset 1px 1px #aaa596 !important; } img[role="presentation"] { display:none !important; } label { margin:0 !important; padding:0 !important; } :host([xplasma-dark="true"]) #main-button { background:linear-gradient(#485469,#313946) !important; color:#e9edf4 !important; border-color:#64748b #10151e #10151e #64748b !important; box-shadow:inset 1px 1px #64748b,inset -1px -1px #252c38 !important; } :host([xplasma-dark="true"]) #main-button:hover { background:linear-gradient(#53637c,#414d60) !important; } :host([xplasma-dark="true"]) #main-button:active { background:#272d38 !important; box-shadow:inset 1px 1px #10151e !important; } :host([xplasma-dark="true"]) .searchmode-switcher-dropmarker { color:#e9edf4 !important; }';
     switcher.shadowRoot.appendChild(style);
    }
   },0);
   new win.MutationObserver(update).observe(switcher,{attributes:true,attributeFilter:['iconsrc']});
  }
  const addressDropdown=d.createXULElement('toolbarbutton');
  addressDropdown.id='ie6-address-dropdown';
  addressDropdown.setAttribute('tooltiptext','Show address history');
  addressDropdown.setAttribute('aria-label','Show address history');
  addressDropdown.addEventListener('command',()=>{
   win.gURLBar.focus();win.gURLBar.startQuery({allowAutofill:false});
  });
  d.querySelector('#urlbar .urlbar-input-container').appendChild(addressDropdown);
  // Native page-icon: images also return the modern generic globe. Look up
  // Places favicon metadata so real website artwork remains untouched.
  const {PlacesUtils}=ChromeUtils.importESModule('resource://gre/modules/PlacesUtils.sys.mjs');
  const bookmarkFile=Components.classes['@mozilla.org/file/directory_service;1'].getService(Components.interfaces.nsIProperties).get('ProfD',Components.interfaces.nsIFile);
  bookmarkFile.append('chrome');bookmarkFile.append('ie6-icons');bookmarkFile.append('sized');bookmarkFile.append('bookmark-page.svg');
  const bookmarkURI=Services.io.newFileURI(bookmarkFile).spec;
  let faviconSeen=new WeakMap();
  async function refreshBookmarks() {
   for(const item of d.querySelectorAll('#PersonalToolbar .bookmark-item:not([container])[image^="page-icon:"]')) {
    const image=item.getAttribute('image');
    if(faviconSeen.get(item)===image)continue;
    faviconSeen.set(item,image);
    try {
     const page=Services.io.newURI(image.slice('page-icon:'.length));
     const icon=typeof PlacesUtils.favicons.getFaviconForPage==='function'
      ? await PlacesUtils.favicons.getFaviconForPage(page)
      : await new Promise(resolve=>PlacesUtils.favicons.getFaviconURLForPage(page,resolve));
     if(!item.isConnected||item.getAttribute('image')!==image)continue;
     item.toggleAttribute('xp-default-favicon',!icon);
     const imageNode=item.querySelector('.toolbarbutton-icon');
     if(imageNode)imageNode.setAttribute('src',icon?image:bookmarkURI);
    } catch(e) { faviconSeen.delete(item); }
   }
  }
  const bookmarkObserver=new win.MutationObserver(()=>refreshBookmarks());
  bookmarkObserver.observe(d.getElementById('PersonalToolbar'),{subtree:true,childList:true,attributes:true,attributeFilter:['image']});
  const faviconChanged=()=>{faviconSeen=new WeakMap();refreshBookmarks();};
  try{PlacesUtils.observers.addListener(['favicon-changed'],faviconChanged);}catch(e){}
  win.addEventListener('unload',()=>{
   bookmarkObserver.disconnect();
   try{PlacesUtils.observers.removeListener(['favicon-changed'],faviconChanged);}catch(e){}
  },{once:true});
  refreshBookmarks();
  const resultIconsSeen=new WeakMap();
  async function refreshResultIcons() {
   for(const imageNode of d.querySelectorAll('#urlbar .urlbarView-favicon[src^="page-icon:"]')) {
    const src=imageNode.getAttribute('src');
    if(resultIconsSeen.get(imageNode)===src)continue;
    resultIconsSeen.set(imageNode,src);
    try {
     const page=Services.io.newURI(src.slice('page-icon:'.length));
     const icon=typeof PlacesUtils.favicons.getFaviconForPage==='function'
      ? await PlacesUtils.favicons.getFaviconForPage(page)
      : await new Promise(resolve=>PlacesUtils.favicons.getFaviconURLForPage(page,resolve));
     if(imageNode.isConnected&&imageNode.getAttribute('src')===src&&!icon)
      imageNode.setAttribute('src',bookmarkURI);
    }catch(e){resultIconsSeen.delete(imageNode);}
   }
  }
  const resultIconsObserver=new win.MutationObserver(()=>refreshResultIcons());
  resultIconsObserver.observe(d.querySelector('#urlbar .urlbarView'),{childList:true,subtree:true,attributes:true,attributeFilter:['src']});
  win.addEventListener('unload',()=>resultIconsObserver.disconnect(),{once:true});
  refreshResultIcons();
  const newTab=d.createXULElement('toolbarbutton');
  newTab.id='ie6-new-tab-button';newTab.className='toolbarbutton-1';
  newTab.setAttribute('label','New Tab');newTab.setAttribute('tooltiptext','New Tab (Ctrl+T)');
  newTab.addEventListener('command',()=>win.BrowserCommands.openTab());
  const printer=d.getElementById('print-button');
  if(printer)printer.after(newTab);else d.getElementById('nav-bar-customization-target').appendChild(newTab);
  // Modern equivalents for the original IE6 Mail, Edit and Discuss tools.
  win.IE6ToolbarActions={
   newMessage(){win.openTrustedLinkIn('mailto:','current');},
   sendLink(){win.MailIntegration.sendLinkForBrowser(win.gBrowser.selectedBrowser);},
   viewSource(){win.BrowserCommands.viewSource(win.gBrowser.selectedBrowser);},
   copyLink(){
    Components.classes['@mozilla.org/widget/clipboardhelper;1'].getService(Components.interfaces.nsIClipboardHelper).copyString(win.gBrowser.selectedBrowser.currentURI.spec);
   },
   savePage(){d.getElementById('Browser:SavePage').doCommand();}
  };
  function tool(id,label,tooltip){
   const button=d.createXULElement('toolbarbutton');button.id=id;button.className='toolbarbutton-1 ie6-extra-tool';
   button.setAttribute('label',label);button.setAttribute('tooltiptext',tooltip);button.setAttribute('aria-label',tooltip);
   return button;
  }
  function popup(button,entries){
   const menu=d.createXULElement('menupopup');menu.id=button.id+'-popup';
   for(const [label,action] of entries){
    const item=d.createXULElement('menuitem');item.setAttribute('label',label);item.setAttribute('data-ie6-action',action);
    item.addEventListener('command',()=>win.IE6ToolbarActions[action]());menu.appendChild(item);
   }
   button.appendChild(menu);
   return menu;
  }
  const mail=tool('ie6-mail-button','Mail','Mail: compose a message or send this page link');
  mail.classList.add('ie6-tool-menu');
  const mailMenu=popup(mail,[['New Message…','newMessage'],['Send Link…','sendLink']]);
  mail.addEventListener('command',event=>{if(event.target===mail)mailMenu.openPopup(mail,'after_start');});
  if(printer)printer.before(mail);else newTab.before(mail);
  const edit=tool('ie6-edit-button','Edit','View page source');
  edit.addEventListener('command',event=>{if(event.target===edit)win.IE6ToolbarActions.viewSource();});
  const editEntries=[['View Page Source','viewSource']];
  if(d.getElementById('Browser:SavePage'))editEntries.push(['Save Page As…','savePage']);
  const editMenu=popup(edit,editEntries);edit.setAttribute('context',editMenu.id);
  if(printer)printer.after(edit);else newTab.before(edit);
  const discuss=tool('ie6-discuss-button','Discuss','Discuss / share this page');
  const discussMenu=popup(discuss,[['Copy Page Link','copyLink'],['Email Page Link…','sendLink']]);
  discuss.addEventListener('command',event=>{if(event.target===discuss)discussMenu.openPopup(discuss,'after_start');});
  edit.after(discuss);
  discuss.after(newTab);
  // IE6 groups navigation, page controls, search/favorites/history and tools
  // with recessed two-pixel separators, independent of button hover borders.
  for (const [id, target] of [['navigation','forward-button'],['page','home-button'],['tools','history-panelmenu']]) {
   const separator=d.createXULElement('toolbarseparator');
   separator.id='ie6-separator-'+id;separator.className='ie6-toolbar-separator';
   separator.setAttribute('aria-hidden','true');
   d.getElementById(target)?.after(separator);
  }
  for (const direction of ['back','forward']) {
   const target=d.getElementById(direction+'-button');
   const arrow=d.createXULElement('toolbarbutton');arrow.id='ie6-'+direction+'-history';
   arrow.className='ie6-history-arrow';arrow.setAttribute('tooltiptext',direction==='back'?'Back history':'Forward history');
   arrow.setAttribute('aria-label',direction==='back'?'Back history':'Forward history');
   arrow.addEventListener('command',()=>d.getElementById('backForwardMenu')?.openPopup(arrow,'after_start'));
   const update=()=>{arrow.disabled=target.disabled;};
   const observer=new win.MutationObserver(update);observer.observe(target,{attributes:true,attributeFilter:['disabled']});
   win.addEventListener('unload',()=>observer.disconnect(),{once:true});update();target.after(arrow);
  }
  const go=d.createXULElement('toolbarbutton');go.id='ie6-go-button';go.setAttribute('label','Go');go.setAttribute('tooltiptext','Go to the address entered');
  go.addEventListener('command',()=>win.gURLBar.handleCommand());
  d.getElementById('urlbar-container').appendChild(go);
  const links=d.createXULElement('toolbarbutton');links.id='ie6-links-button';
  links.setAttribute('label','Links');links.setAttribute('tooltiptext','Open bookmarks');
  links.addEventListener('command',()=>d.getElementById('BMB_bookmarksPopup')?.openPopup(links,'after_end'));
  d.getElementById('urlbar-container').appendChild(links);
  const status=d.createXULElement('hbox');status.id='ie6-statusbar';
  const statusIcon=d.createXULElement('image');statusIcon.id='ie6-status-icon';status.appendChild(statusIcon);
  const statusText=d.createXULElement('label');statusText.id='ie6-status-text';statusText.setAttribute('value','Done');status.appendChild(statusText);
  const progressBox=d.createXULElement('hbox');progressBox.id='ie6-status-progress';
  const progress=d.createElementNS('http://www.w3.org/1999/xhtml','div');progress.className='ie6-load-meter';progress.setAttribute('role','progressbar');progress.setAttribute('aria-label','Page loading');progress.setAttribute('aria-valuemin','0');progress.setAttribute('aria-valuemax','100');progress.hidden=true;
  const progressFill=d.createElementNS('http://www.w3.org/1999/xhtml','div');progressFill.className='ie6-load-fill';progress.appendChild(progressFill);progressBox.appendChild(progress);status.appendChild(progressBox);
  const loadStates=new WeakMap();
  const loadState=browser=>{if(!loadStates.has(browser))loadStates.set(browser,{value:null});return loadStates.get(browser);};
  const paintProgress=()=>{
   const value=loadState(win.gBrowser.selectedBrowser).value;progress.classList.toggle('indeterminate',value===null);
   progressFill.style.width=value===null?'24%':value+'%';
   if(value===null){progress.removeAttribute('aria-valuenow');progress.setAttribute('aria-valuetext','Loading; total size unknown');}
   else{progress.setAttribute('aria-valuenow',String(value));progress.removeAttribute('aria-valuetext');}
  };
  const zone=d.createXULElement('hbox');zone.id='ie6-status-location';zone.setAttribute('tooltiptext','Page location');
  const zoneIcon=d.createXULElement('image');zone.appendChild(zoneIcon);
  const zoneText=d.createXULElement('label');zone.appendChild(zoneText);status.appendChild(zone);
  d.getElementById('browser').appendChild(status);
  const updateLocation=()=>{
   const remote=['http','https'].includes(win.gBrowser.selectedBrowser.currentURI.scheme);
   zone.toggleAttribute('remote',remote);zoneText.setAttribute('value',remote?'Internet':'Local');
  };
  const flags=Components.interfaces.nsIWebProgressListener;
  const statusListener={
   onLocationChange(browser){if(browser===win.gBrowser.selectedBrowser)updateLocation();},
   onStateChange(browser,webProgress,request,stateFlags){
    if(webProgress&&!webProgress.isTopLevel)return;
    if(stateFlags&flags.STATE_IS_NETWORK){
     if(stateFlags&flags.STATE_START)loadState(browser).value=null;
     if(stateFlags&flags.STATE_STOP)loadState(browser).value=null;
     if(browser===win.gBrowser.selectedBrowser)paintProgress();
    }
   },
   onProgressChange(browser,webProgress,request,self,maxSelf,total,maxTotal){
    loadState(browser).value=maxTotal>0&&total>=0?Math.min(100,Math.max(0,total/maxTotal*100)):null;
    if(browser===win.gBrowser.selectedBrowser)paintProgress();
   }
  };
  win.gBrowser.addTabsProgressListener(statusListener);
  win.addEventListener('unload',()=>win.gBrowser.removeTabsProgressListener(statusListener),{once:true});
  const logo=d.createXULElement('image');logo.id='ie6-windows-logo';
  d.getElementById('toolbar-menubar').appendChild(logo);
  const updateLoading=()=>{
   const busy=win.gBrowser.selectedTab.hasAttribute('busy');logo.toggleAttribute('loading',busy);
   statusText.setAttribute('value',busy?'Opening page...':'Done');progress.hidden=!busy;
   if(!busy)loadState(win.gBrowser.selectedBrowser).value=null;paintProgress();updateLocation();
  };
  const loadingObserver=new win.MutationObserver(updateLoading);
  loadingObserver.observe(win.gBrowser.tabContainer,{subtree:true,attributes:true,attributeFilter:['busy']});
  win.gBrowser.tabContainer.addEventListener('TabSelect',updateLoading);
  win.addEventListener('unload',()=>loadingObserver.disconnect(),{once:true});
  updateLoading();
 }
 observers.addObserver({observe(win){try{apply(win);}catch(e){Cu.reportError(e);}}},'browser-delayed-startup-finished');
})();
