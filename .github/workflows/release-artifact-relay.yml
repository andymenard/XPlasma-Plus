name: Retrieve release prebuilt artifacts
on:
  push:
    branches: ['codex/release-1.0.2']
    paths: ['.github/workflows/release-artifact-relay.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  retrieve:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [kubuntu-26.04-amd64, kubuntu-26.04-arm64, fedora-44-amd64, fedora-44-arm64]
    steps:
      - name: Wait for the merged-source native builds
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt = 0; attempt < 240; ++attempt) {
              const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: 40343768940});
              if (run.head_sha !== '99310fa86fd82c20128b082c46ed9bf79258419a') throw new Error('Unexpected build source');
              if (run.status === 'completed') {
                if (run.conclusion !== 'success') throw new Error('Release component builds did not pass');
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 15000));
            }
            throw new Error('Timed out waiting for component builds');
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.target }}-prebuilt
          run-id: 40343768940
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/prebuilt
      - name: Relay verified Linux-only build output
        env:
          XP_TARGET: ${{ matrix.target }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,tarfile
          from pathlib import Path
          target=os.environ['XP_TARGET']
          archive=Path('/tmp/prebuilt')/(target+'-prebuilt.tar.gz')
          with tarfile.open(archive) as source:
              for member in source:
                  if 'payload' in Path(member.name).parts or 'non-free' in Path(member.name).parts:
                      raise RuntimeError('Only Linux build cache files may be relayed')
          data=archive.read_bytes()
          print('XPLASMA_RELAY_META '+json.dumps({'target':target,'size':len(data),'sha256':hashlib.sha256(data).hexdigest()}),flush=True)
          count=0
          for count,offset in enumerate(range(0,len(data),12288),1):
              print('XPLASMA_RELAY_CHUNK '+target+' '+str(count)+' '+base64.b64encode(data[offset:offset+12288]).decode(),flush=True)
          print('XPLASMA_RELAY_END '+target+' '+str(count),flush=True)
          PY
